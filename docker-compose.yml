# MySQL cho backend:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calo_khay
      MYSQL_USER: calo
      MYSQL_PASSWORD: calo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"   # đổi cổng trên máy bằng MYSQL_PORT trong .env (vd. máy đã có MySQL ở 3306)
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
